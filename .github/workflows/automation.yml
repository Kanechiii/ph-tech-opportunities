name: PH Tech Opportunities Automation

# Phase 2 - Step 1
# Execute tests manually or when changes are pushed.
# No email credentials or actual email delivery yet.

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/automation.yml"

permissions:
  contents: read

jobs:
  test-automation:
    name: Test Python Application

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Check Python version
        run: |
          python --version

      - name: Run automated tests
        run: |
          python -m pytest -v

      - name: Preview automation
        run: |
          python -m src.main