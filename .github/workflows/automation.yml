name: PH Tech Opportunities Automation

# Phase 2 - Step 3
# Automated testing with optional manual email delivery.
# Scheduled execution is not enabled yet.

on:
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send a real test notification email?"
        required: true
        type: boolean
        default: false

      bootstrap_database:
        description: "Initialize hosted SQLite storage only if no snapshot exists?"
        required: true
        type: boolean
        default: false

  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "config/sources.yaml"
      - "requirements.txt"
      - ".github/workflows/automation.yml"

  schedule:
    - cron: "15 8 * * *"
      timezone: "Asia/Manila"

permissions:
  contents: read
  actions: read

concurrency:
  group: ph-tech-opportunities-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-automation:
    name: Test Python Application

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Check Python version
        run: |
          python --version

      - name: Run automated tests
        run: |
          python -m pytest -v

      - name: Preview automation
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.send_email == false) }}
        run: |
          python -m src.main

      - name: Preview classified RSS announcements
        id: rss_preview
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.send_email == false) }}
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python -m src.collectors.source_registry

      - name: Summarize RSS collection status
        if: ${{ always() && steps.rss_preview.outcome != 'skipped' }}
        env:
          RSS_OUTCOME: ${{ steps.rss_preview.outcome }}
        run: |
          if [ "$RSS_OUTCOME" = "success" ]; then
            echo "RSS classification preview succeeded." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: RSS classification preview did not complete successfully." >> "$GITHUB_STEP_SUMMARY"
            echo "Review the RSS collection step logs for failed sources." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Restore hosted SQLite snapshot
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.send_email == false) }}
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_DATABASE: ${{ inputs.bootstrap_database || false }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for the latest SQLite snapshot..."

          artifact_id="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=ph-tech-sqlite&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")] | sort_by(.created_at) | last | .id // empty'
          )"

          if [ -n "$artifact_id" ]; then
            echo "Restoring an existing hosted snapshot."

            curl --fail --location --silent --show-error \
              --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              --output "$RUNNER_TEMP/sqlite-snapshot.zip"

            python -m src.database.snapshot restore \
              "$RUNNER_TEMP/sqlite-snapshot.zip"

          elif [ "$BOOTSTRAP_DATABASE" = "true" ] && [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Explicitly initializing the first hosted database."
            python -m src.database.schema
            python -m src.database.snapshot validate

          else
            echo "::error::No usable SQLite snapshot was found."
            echo "::error::For first-time setup, run manually with bootstrap_database enabled."
            exit 1
          fi

      - name: Collect and persist RSS announcements
        id: persistent_collection
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.send_email == false) }}
        timeout-minutes: 3
        run: |
          python -m src.database.collection_service

      - name: Create validated SQLite snapshot
        if: ${{ steps.persistent_collection.outcome == 'success' }}
        run: |
          python -m src.database.snapshot backup

      - name: Upload hosted SQLite snapshot
        if: ${{ steps.persistent_collection.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ph-tech-sqlite
          path: data/snapshot_upload/opportunities.sqlite3
          retention-days: 90
          if-no-files-found: error
          compression-level: 6

      - name: Summarize persistent collection
        if: ${{ always() && steps.persistent_collection.outcome != 'skipped' }}
        env:
          COLLECTION_OUTCOME: ${{ steps.persistent_collection.outcome }}
        shell: bash
        run: |
          if [ "$COLLECTION_OUTCOME" = "success" ]; then
            echo "### SQLite collection" >> "$GITHUB_STEP_SUMMARY"
            echo "Collection completed successfully." >> "$GITHUB_STEP_SUMMARY"
            echo "Check the snapshot upload step to confirm persistence." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### SQLite collection failed" >> "$GITHUB_STEP_SUMMARY"
            echo "The database collection did not complete successfully." >> "$GITHUB_STEP_SUMMARY"
            echo "A replacement snapshot must not be uploaded." >> "$GITHUB_STEP_SUMMARY"
            echo "Review the collection and restore logs before rerunning." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate email configuration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_email == true }}
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python -c "import os, sys; required = ('SENDER_EMAIL', 'SENDER_APP_PASSWORD', 'RECIPIENT_EMAIL'); missing = [key for key in required if not os.environ.get(key, '').strip()]; print('Email configuration: ' + ('missing required secrets' if missing else 'all required secrets present')); sys.exit(1 if missing else 0)"

      - name: Diagnose SMTP configuration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_email == true }}
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python - <<'PY'
          import os
          import sys
          from src.email_sender import get_email_config

          print("Checking Gmail SMTP configuration...")

          try:
              config = get_email_config()

          except ValueError as error:
              message = str(error)

              if "Missing environment variable" in message:
                  print("FAILED: A required variable is missing.")
              elif "placeholder values" in message:
                  print("FAILED: A secret still contains a placeholder.")
              elif "Invalid email address" in message:
                  print("FAILED: An email address has invalid formatting.")
              elif "SMTP_PORT" in message or "SMTP port" in message:
                  print("FAILED: Invalid SMTP port.")
              else:
                  print("FAILED: Other configuration validation error.")

              sys.exit(1)

          print("PASSED: All required configuration values passed validation.")
          PY

      - name: Send test notification email
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_email == true }}
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          APP_NAME: PH Tech Opportunities Automation
          APP_TIMEZONE: Asia/Manila
          APP_ENV: development
        run: |
          python -m src.main --send