      - name: Validate email configuration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_email == true }}
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python - <<'PY'
          import os
          import sys

          from src.email_sender import get_email_config

          try:
              get_email_config()

          except ValueError as error:
              message = str(error)

              if message.startswith("Missing environment variable:"):
                  print("ERROR: Required email configuration is missing.")
              elif message.startswith("Invalid email address:"):
                  print("ERROR: Sender or recipient email format is invalid.")
              elif "placeholder values" in message:
                  print("ERROR: A configuration value is still a placeholder.")
              elif "SMTP_PORT" in message or "SMTP port" in message:
                  print("ERROR: SMTP port configuration is invalid.")
              else:
                  print("ERROR: Email configuration validation failed.")

              sys.exit(1)

          print("SUCCESS: Email configuration passed validation.")
          PY