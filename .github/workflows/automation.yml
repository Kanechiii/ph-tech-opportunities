name: PH Tech Opportunities Automation

# Phase 2 - Step 3
# Automated testing with optional manual email delivery.
# Scheduled execution is not enabled yet.

on:
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send a real test notification email?"
        required: true
        type: boolean
        default: false

  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "config/sources.yaml"
      - "requirements.txt"
      - ".github/workflows/automation.yml"

  schedule:
    - cron: "15 8 * * *"
      timezone: "Asia/Manila"

permissions:
  contents: read

concurrency:
  group: ph-tech-opportunities-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-automation:
    name: Test Python Application

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Check Python version
        run: |
          python --version

      - name: Run automated tests
        run: |
          python -m pytest -v

      - name: Preview automation
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.send_email == false) }}
        run: |
          python -m src.main

      - name: Preview classified RSS announcements
        id: rss_preview
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.send_email == false) }}
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python -m src.collectors.source_registry

      - name: Summarize RSS collection status
        if: ${{ always() && steps.rss_preview.outcome != 'skipped' }}
        env:
          RSS_OUTCOME: ${{ steps.rss_preview.outcome }}
        run: |
          if [ "$RSS_OUTCOME" = "success" ]; then
            echo "RSS classification preview succeeded." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: RSS classification preview did not complete successfully." >> "$GITHUB_STEP_SUMMARY"
            echo "Review the RSS collection step logs for failed sources." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate email configuration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_email == true }}
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python -c "import os, sys; required = ('SENDER_EMAIL', 'SENDER_APP_PASSWORD', 'RECIPIENT_EMAIL'); missing = [key for key in required if not os.environ.get(key, '').strip()]; print('Email configuration: ' + ('missing required secrets' if missing else 'all required secrets present')); sys.exit(1 if missing else 0)"

      - name: Diagnose SMTP configuration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_email == true }}
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python - <<'PY'
          import os
          import sys
          from src.email_sender import get_email_config

          print("Checking Gmail SMTP configuration...")

          try:
              config = get_email_config()

          except ValueError as error:
              message = str(error)

              if "Missing environment variable" in message:
                  print("FAILED: A required variable is missing.")
              elif "placeholder values" in message:
                  print("FAILED: A secret still contains a placeholder.")
              elif "Invalid email address" in message:
                  print("FAILED: An email address has invalid formatting.")
              elif "SMTP_PORT" in message or "SMTP port" in message:
                  print("FAILED: Invalid SMTP port.")
              else:
                  print("FAILED: Other configuration validation error.")

              sys.exit(1)

          print("PASSED: All required configuration values passed validation.")
          PY

      - name: Send test notification email
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_email == true }}
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          APP_NAME: PH Tech Opportunities Automation
          APP_TIMEZONE: Asia/Manila
          APP_ENV: development
        run: |
          python -m src.main --send